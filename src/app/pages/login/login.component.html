<!-- Con el buzón elegido el login toma su paleta (guinda), igual que el panel web. -->
<ion-content class="ion-padding" [class.tema-buzon]="modulo === MODULOS.BUZON" [fullscreen]="true">
  <div class="login-wrapper">
    <div class="brand">
      <div class="brand-icon">
        <ion-icon [name]="modulo === MODULOS.BUZON ? 'mail' : 'notifications'"></ion-icon>
      </div>
      @if (modulo === MODULOS.BUZON) {
        <h1>Buzón electrónico</h1>
        <p>Candidaturas del POPJL</p>
      } @else {
        <h1>Notificaciones</h1>
        <p>Ingresa con tu correo para continuar</p>
      }
    </div>

    <ion-segment [(ngModel)]="modulo" name="modulo" [disabled]="loading">
      <ion-segment-button [value]="MODULOS.SNEDJ">
        <ion-label>Notificaciones</ion-label>
      </ion-segment-button>
      <ion-segment-button [value]="MODULOS.BUZON">
        <ion-label>Buzón</ion-label>
      </ion-segment-button>
    </ion-segment>

    <form #loginForm="ngForm" (ngSubmit)="onSubmit()">
      <ion-input
        name="email"
        type="email"
        inputmode="email"
        autocomplete="username"
        label="Correo"
        labelPlacement="floating"
        fill="outline"
        placeholder="usuario@mail.com"
        [(ngModel)]="email"
        required
      ></ion-input>

      <ion-input
        name="password"
        type="password"
        autocomplete="current-password"
        label="Contraseña"
        labelPlacement="floating"
        fill="outline"
        [(ngModel)]="password"
        required
      >
        <ion-input-password-toggle slot="end"></ion-input-password-toggle>
      </ion-input>

      @if (errorMessage) {
        <ion-text color="danger">
          <p class="error">{{ errorMessage }}</p>
        </ion-text>
      }

      <ion-button type="submit" expand="block" shape="round" [disabled]="loginForm.invalid || loading">
        @if (loading) {
          <ion-spinner name="crescent"></ion-spinner>
        } @else {
          Entrar
        }
      </ion-button>
    </form>
  </div>
</ion-content>
